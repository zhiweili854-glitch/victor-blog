一大早的去赛场布置，下午紧跟学生代表大会，代表常委委员会选中了，但也是个挂名。 ​27日正式开始比赛答辩（我不答，处理赛前及赛时信息与流程，保证比赛顺利成功） ​那个比赛首届好多问题，好在都可以及时去处理。 不管能不能成功？做了再说~ 保佑[图片]重庆康明斯种子营中选，明年埃森哲实习能够兑现，千万别口头支票。找工作好难的[图片] ​\",\"category\":\"技术\",\"tags\":[\"技术\"],\"hasMedia\":true,\"mediaCount\":18,\"mediaTypes\":[\"image\"],\"images\":[],\"cover\":\"https://bu.dusays.com/2026/03/24/69c1e38b346cb.jpg\",\"location\":\"\"},{\"id\":\"ts-15\",\"source\":\"ts\",\"date_iso\":\"2025-12-06T22:29:00\",\"date_display\":\"2025/12/06 22:29\",\"title\":\"这对吗？感觉不是很像的样子\",\"excerpt\":\"这对吗？感觉不是很像的样子。没有见过建筑图纸的样子呀。 ​制图员都这样吗？感觉很潦草，嗯，再试几个，看看招聘信息要求是什么样的？\",\"content\":\"这对吗？感觉不是很像的样子。没有见过建筑图纸的样子呀。 ​制图员都这样吗？感觉很潦草，嗯，再试几个，看看招聘信息要求是什么样的？\",\"category\":\"日常\",\"tags\":[\"日常\"],\"hasMedia\":true,\"mediaCount\":4,\"mediaTypes\":[\"image\"],\"images\":[],\"cover\":\"https://bu.dusays.com/2026/03/24/69c1e38b346cb.jpg\",\"location\":\"\"},{\"id\":\"ts-16\",\"source\":\"ts\",\"date_iso\":\"2025-11-30T11:16:00\",\"date_display\":\"2025/11/30 11:16\",\"title\":\"我有几个叔叔一个叫Auto 另一个姓中望…\",\"excerpt\":\"我有几个叔叔一个叫Auto 另一个姓中望，他们总是希望让我和他们一样，从事这方面，可以将该死的元件尺寸定死，试一试PCB外壳渲染多么的惊喜，但看看他一个进程。吃了我3.8G，我的系统才是4GB！他会把我的系统吃崩的。\",\"content\":\"我有几个叔叔一个叫Auto 另一个姓中望，他们总是希望让我和他们一样，从事这方面，可以将该死的元件尺寸定死，试一试PCB外壳渲染多么的惊喜，但看看他一个进程。吃了我3.8G，我的系统才是4GB！他会把我的系统吃崩的。最后冷冰冰的告诉我“Drawing file is not valid.” ​在深夜中总会无意间吞噬掉我太多的生命和时间。 ​但又一次的看着“FATAL ERROR”听着风扇哀鸣，流下未保存的眼泪。 ​（太吃脑子和空间逻辑运算了）\",\"category\":\"日常\",\"tags\":[\"日常\"],\"hasMedia\":true,\"mediaCount\":10,\"mediaTypes\":[\"image\"],\"images\":[],\"cover\":\"https://bu.dusays.com/2026/03/24/69c1e38b346cb.jpg\",\"location\":\"\"},{\"id\":\"ts-17\",\"source\":\"ts\",\"date_iso\":\"2025-11-17T20:37:00\",\"date_display\":\"2025/11/17 20:37\",\"title\":\"我们无法阻止AI的进步与使用，君子非生义而善假于物也\",\"excerpt\":\"我们无法阻止AI的进步与使用，君子非生义而善假于物也。但我们要学会正确高端使用，（你也得学会点基础要不然你看不懂） ​我先说一下子推荐，这个是用于终端的AI，可智能化的终端系统。不同的编程平台中都可在终端可以插入使用。\",\"content\":\"我们无法阻止AI的进步与使用，君子非生义而善假于物也。但我们要学会正确高端使用，（你也得学会点基础要不然你看不懂） ​我先说一下子推荐，这个是用于终端的AI，可智能化的终端系统。不同的编程平台中都可在终端可以插入使用。 在同样的知识水平基础上，比谁会使用智能，智能改写智能核查。 如果你还是使用网页版，简简单单的把错误的内容复制过去，那只能说你你没有学好哲学。 事物都是有联系性的，一个错误的产生，不仅是单单一个，而是多种原因可能性的产生，这时候，如果你使用编程平台中的Al智能，他就可以全整体性的审查和优化。 ​ 这个为什么要推荐这个终端ai，他更接近于底层，就像前段时间学的LinUx，用指令进行远程操控和控制系统。这个也一样。 当时学的一塌糊涂​[图片]，看见这个激发我的热情，真是又菜又爱玩。各位去尝试体验一下吧。\",\"category\":\"技术\",\"tags\":[\"技术\"],\"hasMedia\":true,\"mediaCount\":12,\"mediaTypes\":[\"image\"],\"images\":[],\"cover\":\"https://bu.dusays.com/2026/03/24/69c1e38b346cb.jpg\",\"location\":\"\"},{\"id\":\"ts-18\",\"source\":\"ts\",\"date_iso\":\"2025-11-14T19:21:00\",\"date_display\":\"2025/11/14 19:21\",\"title\":\"我听见招灾的回响，生生不息\",\"excerpt\":\"我听见招灾的回响，生生不息。 ​近月压抑，在速度与生命中得到安抚。飞车与终焉，及嫁衣令人，解放自己， 今天先忘去工作与学习，安享片刻欢愉。明天再奋斗工作与学习。[图片][图片]\",\"content\":\"我听见招灾的回响，生生不息。 ​近月压抑，在速度与生命中得到安抚。飞车与终焉，及嫁衣令人，解放自己， 今天先忘去工作与学习，安享片刻欢愉。明天再奋斗工作与学习。[图片][图片]\",\"category\":\"技术\",\"tags\":[\"技术\"],\"hasMedia\":true,\"mediaCount\":18,\"mediaTypes\":[\"image\"],\"images\":[],\"cover\":\"https://bu.dusays.com/2026/03/24/69c1e38b346cb.jpg\",\"location\":\"\"},{\"id\":\"ts-19\",\"source\":\"ts\",\"date_iso\":\"2025-11-12T18:48:00\",\"date_display\":\"2025/11/12 18:48\",\"title\":\"至善至美，大学之章，明德素民，臻子于至善境\",\"excerpt\":\"至善至美，大学之章，明德素民，臻子于至善境。你我携手共进\",\"content\":\"至善至美，大学之章，明德素民，臻子于至善境。你我携手共进\",\"category\":\"日常\",\"tags\":[\"日常\"],\"hasMedia\":false,\"mediaCount\":0,\"mediaTypes\":[],\"images\":[],\"cover\":\"https://bu.dusays.com/2026/03/24/69c1e38b346cb.jpg\",\"location\":\"\"},{\"id\":\"ts-20\",\"source\":\"ts\",\"date_iso\":\"2025-11-07T20:39:00\",\"date_display\":\"2025/11/07 20:39\",\"title\":\"忽来之寒霞，嗽立以斜雨， 与朋友​去本部，嘿看错时间了…\",\"excerpt\":\"忽来之寒霞，嗽立以斜雨， 与朋友​去本部，嘿看错时间了，将错就错，吃个学校小火锅，喝个茶~以渡佘冬[图片] ​明天接着上课！\",\"content\":\"忽来之寒霞，嗽立以斜雨， 与朋友​去本部，嘿看错时间了，将错就错，吃个学校小火锅，喝个茶~以渡佘冬[图片] ​明天接着上课！\",\"category\":\"技术\",\"tags\":[\"技术\"],\"hasMedia\":true,\"mediaCount\":4,\"mediaTypes\":[\"image\"],\"images\":[],\"cover\":\"https://bu.dusays.com/2026/03/24/69c1e38b346cb.jpg\",\"location\":\"\"},{\"id\":\"ts-21\",\"source\":\"ts\",\"date_iso\":\"2025-07-31T21:18:00\",\"date_display\":\"2025/07/31 21:18\",\"title\":\"📷 图片分享\",\"excerpt\":\"\",\"content\":\"\",\"category\":\"纯图\",\"tags\":[\"图文\"],\"hasMedia\":true,\"mediaCount\":2,\"mediaTypes\":[\"image\"],\"images\":[],\"cover\":\"https://bu.dusays.com/2026/03/24/69c1e38b346cb.jpg\",\"location\":\"\"},{\"id\":\"ts-22\",\"source\":\"ts\",\"date_iso\":\"2025-07-29T13:01:00\",\"date_display\":\"2025/07/29 13:01\",\"title\":\"大家对历史了解深吗\",\"excerpt\":\"大家对历史了解深吗？ ​南京大屠杀有多少人？三十万人数据怎么来的。“屠杀的记录是有的，用于统计大概人数也是足够有说明力的，为什么不把这些内容放进教材中？而是只写一个数字？\",\"content\":\"大家对历史了解深吗？ ​南京大屠杀有多少人？三十万人数据怎么来的。“屠杀的记录是有的，用于统计大概人数也是足够有说明力的，为什么不把这些内容放进教材中？而是只写一个数字？” “或者至少列出一个名目，让学生有需要的时候可以去查证？以至于他觉得几乎每个中国人说起日本罪行，都会把金陵大屠杀拿出来，却没有一个人，包括我，能够给出数字的证据。这不应该。 ​这为什么，看的手中的书。 “只谈南京大屠杀，我的总体观点是，如果一个仇恨事件被略化了，简化了，那么一定走向虚无化，没有了实际的情节，也就没有了情感具象的锚点，则这种仇恨终将沦为一个符号，从此不再具有情感效果。” ​“中国人要记住金陵大屠杀，不能仅仅停留在一个名字一个数字上，应该有更加具体的、细节化的普及教育，否则就会淡忘、不在意。” ​电影，小说，正好是具体化。但国人也有阻挠。如731电影，说血腥暴力，不利孩子教育，那几个傻娃娃每天拿个啦叭一个劲吧咔吧咔，吧个头，忘记过去是背叛，是虚无历史，当年的屠杀，小孩是挑飞的肚皮，用人体当靶子随意的屠杀。血腥政治敏感不过审，过去的历史都是血腥，不过审的吗？我也愧疚我的历史老师。 ​日本客观实在的，不可能一味的否定抵制。在防备外敌时首先防备它，在成为障碍时首先摧毁它，在怀疑时首先怀疑它。” “它作为一个客观存在的实体，必然有其美好之处，那么就学习它，超越它。” “固定在那里的，不可复制的美好的东西，倘使某一天有这样的机会，就占据它消化它。” “国恨家仇的报复不应该停留在血勇之气上，而应该成为长远的谋算。 ​我们一边能骂娘，一边跟脑残智障乱七八糟，巴卡巴卡的。那都是先辈抱着可能是灭亡国灭种的绝望，仍冲锋用血肉筑起长城。得来的。\",\"category\":\"旅行\",\"tags\":[\"旅行\"],\"hasMedia\":false,\"mediaCount\":0,\"mediaTypes\":[],\"images\":[],\"cover\":\"https://bu.dusays.com/2026/03/24/69c1e38b346cb.jpg\",\"location\":\"\"},{\"id\":\"ts-23\",\"source\":\"ts\",\"date_iso\":\"2025-07-21T18:56:00\",\"date_display\":\"2025/07/21 18:56\",\"title\":\"语文是非常美丽的一朵花 你得细细去闻 才能闻到它的芳香…\",\"excerpt\":\"语文是非常美丽的一朵花 你得细细去闻 才能闻到它的芳香 回首过去，眼中尽泪。 ​小的时候不明白他的美，但是他的品德也是深深的润化着我们，我们学习可能不好，生活可能不如意，但我们的品德仍像小时候一样纯真。\",\"content\":\"语文是非常美丽的一朵花 你得细细去闻 才能闻到它的芳香 回首过去，眼中尽泪。 ​小的时候不明白他的美，但是他的品德也是深深的润化着我们，我们学习可能不好，生活可能不如意，但我们的品德仍像小时候一样纯真。 ​小时候的书籍也是我一直舍不得的丢弃。回首他也完成了我的闭环。\",\"category\":\"日常\",\"tags\":[\"日常\"],\"hasMedia\":true,\"mediaCount\":2,\"mediaTypes\":[\"video\",\"image\"],\"images\":[],\"cover\":\"https://bu.dusays.com/2026/03/24/69c1e38b346cb.jpg\",\"location\":\"\"},{\"id\":\"ts-24\",\"source\":\"ts\",\"date_iso\":\"2025-06-26T14:45:00\",\"date_display\":\"2025/06/26 14:45\",\"title\":\"好消息，找到实习兼职了，坏消息全英文…\",\"excerpt\":\"好消息，找到实习兼职了，坏消息全英文，当初我说未来绝对绝对不会与英语有任何关系。现在我正在努力记单词，现在请叫我“Victor Li” ​现在劝告各位能学英语最好学点英语໒꒰ྀིᜊ꒦ິ^꒦ິᜊ ꒱ྀིა ​与此同时，\",\"content\":\"好消息，找到实习兼职了，坏消息全英文，当初我说未来绝对绝对不会与英语有任何关系。现在我正在努力记单词，现在请叫我“Victor Li” ​现在劝告各位能学英语最好学点英语໒꒰ྀིᜊ꒦ິ^꒦ິᜊ ꒱ྀིა ​与此同时，得到了组织的认可，进一步发挥自己的能力，哦耶。(♡\u0026amp;gt;𖥦\u0026amp;lt;)/♥ ​看这名字，为我的大学又添加了一笔。（下回找一个不要英语的实习）\",\"category\":\"实习\",\"tags\":[\"实习\"],\"hasMedia\":true,\"mediaCount\":8,\"mediaTypes\":[\"image\"],\"images\":[],\"cover\":\"https://bu.dusays.com/2026/03/24/69c1e38b346cb.jpg\",\"location\":\"\"},{\"id\":\"ts-25\",\"source\":\"ts\",\"date_iso\":\"2025-06-22T17:39:00\",\"date_display\":\"2025/06/22 17:39\",\"title\":\"难舍 难分 难解 缘起 缘浅 缘灭 今生相见 定有亏欠…\",\"excerpt\":\"难舍 难分 难解 缘起 缘浅 缘灭 今生相见 定有亏欠 前世不欠 今生不见 ​夫人有七情六欲，历生老病死，其间\u0026quot;相伴相知\u0026quot;之渴，尤甚于莩甲之待甘霖。\",\"content\":\"难舍 难分 难解 缘起 缘浅 缘灭 今生相见 定有亏欠 前世不欠 今生不见 ​夫人有七情六欲，历生老病死，其间\u0026quot;相伴相知\u0026quot;之渴，尤甚于莩甲之待甘霖。童稚失怙，茕茕少欢，诚如古语：\u0026quot;天之道损有余，人之道损不足。\u0026quot;情之亏欠处，心必求索之。 尝见一子，幼失椿萱，长遭龀辱，遂铸情为铁，奉理作藩。初时痛减三分，渐而同感尽湮——观他人涕泗，心若止水，惟余世故权衡，难生戚戚。更遇病躯，先天羸弱，踽踽独行如孤鹤唳空。虽礼周众人，然眸底深藏稚子之盼，尝效同病相怜之态，强作烂漫之戏。然指节攥白处，终不解情为何物。 余尝劝曰：\u0026quot;浮生若露，何如太上忘情？\u0026quot;彼却执念如火：\u0026quot;但求片语相知，纵天地藐藐，惟君足矣。\u0026quot;此言灼灼，照我寒潭，令余惶惑。其心炽如熔金，照我胸中块垒，竟若金石之冷。诉衷肠于无情之物，求赤诚于木偶之身，岂非双生之疾？今隔千山暮雪，余能为之者，惟守荧荧之火，待旦夕之应。嗟乎！情之一字，或为穿肠毒药，或为续命丹砂，谁又能参透这\u0026quot;损不足而奉有余\u0026quot;的人间至理？ ​ ​ ​བློས་གཏོང་དཀའ་། བློས་གཏོང་དཀའ་། གྲོལ་དཀའ་། ལས་དབང་ནས་ལས་དབང་མེད་པར་གྱུར་།\",\"category\":\"日常\",\"tags\":[\"日常\"],\"hasMedia\":false,\"mediaCount\":0,\"mediaTypes\":[],\"images\":[],\"cover\":\"https://bu.dusays.com/2026/03/24/69c1e38b346cb.jpg\",\"location\":\"\"},{\"id\":\"ts-26\",\"source\":\"ts\",\"date_iso\":\"2025-06-18T09:37:00\",\"date_display\":\"2025/06/18 09:37\",\"title\":\"知道一上午去五个医院（北医，中医，普仁，同仁，铁营）…\",\"excerpt\":\"知道一上午
